name: test-go
description: "Run coordinator Go tests through the runnerlib lifecycle"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:dev
  command: "runnerlib run --job-command true"
  timeout: 1800
  priority: 10
  working_dir: /job
environment:
  REACTORCIDE_CI_JOB: test-go
run_local:
  user: host
