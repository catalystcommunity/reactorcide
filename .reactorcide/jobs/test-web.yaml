name: test-web
description: "Run web application Go tests through the runnerlib lifecycle"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  priority: 10
  working_dir: /job
environment:
  REACTORCIDE_CI_JOB: test-web
run_local:
  user: host
