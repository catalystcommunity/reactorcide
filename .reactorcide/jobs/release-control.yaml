name: release-control
description: "Prepare or publish a coordinated Reactorcide release"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:dev
  command: "runnerlib run --job-command true"
  timeout: 600
  priority: 15
  working_dir: /job
  disable_run_local: true
environment:
  GITHUB_PAT: "${secret:catalystcommunity/ci:githubpat}"
