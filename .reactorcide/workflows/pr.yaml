name: Reactorcide PR
description: "Validate commits, then run the Go, Python, and web test suites for pull requests."

# The workflow trigger. One event can match several workflows, so pipelines
# can split per team, product, or org. Each workflow shows up as its own
# named check.
on:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main

# Each job references a reusable definition in .reactorcide/jobs/ and overlays
# the workflow-specific DAG (depends_on). The three test jobs run only after
# conventional-commits succeeds.
jobs:
  conventional-commits:
    job_file: conventional-commits.yaml

  test-go:
    job_file: test-go.yaml
    depends_on:
      - conventional-commits

  test-python:
    job_file: test-python.yaml
    depends_on:
      - conventional-commits

  test-web:
    job_file: test-web.yaml
    depends_on:
      - conventional-commits
