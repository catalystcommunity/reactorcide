# The workflow's stable SECURITY IDENTITY, distinct from the display `name`
# below. The coordinator's stored CI policy names this id in its `workflows:`
# matcher, and head-CI policy is evaluated ONLY for a workflow that declares an
# explicit id (internal/worker/trigger_processor.go, `head.ExplicitID`).
#
# Without it the id is derived from the filename ("pr") and marked
# non-explicit, so the policy never fires and every PR runs base CI regardless
# of what the policy says. Changing this value silently detaches the policy
# again: it must keep matching the stored policy's `workflows:` entry.
id: reactorcide-pr
name: Reactorcide PR
description: "Validate commits, then run the Go, Python, and web test suites for pull requests."

# The workflow trigger. One event can match several workflows, so pipelines
# can split per team, product, or org. Each workflow shows up as its own
# named check.
on:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main

# Each job references a reusable definition in .reactorcide/jobs/ and overlays
# the workflow-specific DAG (depends_on). The three test jobs run only after
# conventional-commits succeeds.
jobs:
  conventional-commits:
    job_file: conventional-commits.yaml

  test-go:
    job_file: test-go.yaml
    depends_on:
      - conventional-commits

  test-python:
    job_file: test-python.yaml
    depends_on:
      - conventional-commits

  test-web:
    job_file: test-web.yaml
    depends_on:
      - conventional-commits
