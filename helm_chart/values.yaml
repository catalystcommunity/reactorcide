app:
  enabled: true # enabled by default
  image:
    repository: containers.catalystsquad.com/public/reactorcide/coordinator
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion
    tag: "dev"
  prometheus:
    enabled: false
    path: /metrics
    port: 9000
    latencyHistogramsEnabled: true
  service:
    type: ClusterIP
    port: 6080
  # In-cluster coordinator API URL that job containers use to submit child jobs /
  # new workflows (injected as REACTORCIDE_COORDINATOR_URL by BuildJobEnv).
  # Empty = auto-derive "http://<app>.<namespace>.svc.cluster.local:<port>".
  jobApiUrl: ""
  # Secret holding the API token the coordinator injects into job containers as
  # REACTORCIDE_API_TOKEN (defaults to the deploy-managed user secret / "token"
  # key -- the same token the web app uses). The reference is optional so the
  # coordinator starts even before the token has been created.
  apiTokenSecret:
    name: ""  # default: defaults.apiTokenSecretName
    key: ""   # default: "token"
  # Gateway API HTTPRoute configuration (routes /api/* to coordinator)
  gateway:
    enabled: false
    # List of domains to create HTTPRoutes for
    domains: []
    # Example:
    # domains:
    #   - reactorcide.example.com
    # Name of the Gateway resource to attach to
    gatewayName: ""
    # Namespace of the Gateway (optional, defaults to same namespace)
    gatewayNamespace: ""
    # Section name on the Gateway (listener name)
    sectionName: "https"
    # Additional annotations for the HTTPRoute
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  replicaCount: 1
  commitOnSuccess: true
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

web:
  enabled: false # disabled by default
  image:
    repository: containers.catalystsquad.com/public/reactorcide/web
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion
    tag: "dev"
  service:
    type: ClusterIP
    port: 4080
  apiUrl: "http://reactorcideapp:6080"
  # API token for authenticating with the coordinator API
  apiTokenSecret:
    name: "base-reactorcide-api-token"
    key: "token"
  # Disables the Secure flag on the session cookie (see docs/ui-auth.md).
  # Only set this true if the web pod is reached over plain HTTP with no TLS
  # terminator in front of it (e.g. some local/dev setups) — leave false for
  # any real deployment, which must terminate TLS in front of this service.
  webCookieInsecure: false
  # Gateway API HTTPRoute configuration (routes /* to web UI)
  gateway:
    enabled: false
    # List of domains to create HTTPRoutes for
    domains: []
    # Example:
    # domains:
    #   - reactorcide.example.com
    # Name of the Gateway resource to attach to
    gatewayName: ""
    # Namespace of the Gateway (optional, defaults to same namespace)
    gatewayNamespace: ""
    # Section name on the Gateway (listener name)
    sectionName: "https"
    # Additional annotations for the HTTPRoute
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

worker:
  enabled: true
  image:
    repository: containers.catalystsquad.com/public/reactorcide/worker
    pullPolicy: Always
    tag: "dev"
  replicaCount: 1
  concurrency: 2    # concurrent leases (jobs) per worker pod
  metricsInterval: 2s
  storageMetricsInterval: 10s
  telemetrySendInterval: 10s
  telemetryBufferBatches: 12
  terminationGracePeriodSeconds: 3600
  containerRuntime: "auto"

  # --- Coordinator-mediated worker ---
  # The worker authenticates to the coordinator over CSIL-RPC and pulls work
  # through it; it has no direct corndogs, Postgres, or object-store
  # dependency of its own. See docs/workers.md ("Deploying workers") and
  # helm_chart/DEPLOYMENT.md for the full operator flow.
  #
  # In-cluster URL of the coordinator this worker registers with. Leave
  # empty to default to this release's coordinator Service
  # (http://<app-name>.<namespace>.svc.cluster.local:<app.service.port>);
  # only set this for out-of-cluster or cross-namespace workers.
  coordinatorUrl: ""
  # Enrollment token (secret) -- ZERO-TOUCH by default.
  #
  # Leave enrollmentTokenSecret.name EMPTY (the default) and the chart
  # auto-provisions everything: it generates a stable enrollment token once
  # into a managed Secret (see managedEnrollmentTokenSecret below), the
  # coordinator seeds its default worker pool from that same token, and this
  # worker enrolls with it -- no kubectl, no admin-UI step, no manual Secret.
  # The token is generated in-cluster (randAlphaNum) and never written to
  # values.yaml or any committed file.
  #
  # OPERATOR OVERRIDE: to use a token you manage yourself (created via the
  # coordinator admin UI/CLI and stored with `kubectl create secret ...`),
  # set enrollmentTokenSecret.name to that Secret. When set, the chart does
  # NOT create the managed Secret, and both the worker and the coordinator
  # (its REACTORCIDE_DEFAULT_WORKER_ENROLLMENT_TOKEN) read your Secret instead.
  enrollmentTokenSecret:
    name: ""       # override: name of a Secret YOU manage; empty = auto-provision
    key: "token"   # key within that override secret holding the token
  # Managed (auto-generated) enrollment token Secret used when the override
  # above is unset. Rendered by templates/secret-worker-enrollment.yaml with
  # helm.sh/resource-policy: keep so the value survives upgrades/uninstalls.
  # Leave name empty to default to "<worker-name>-enrollment".
  managedEnrollmentTokenSecret:
    name: ""       # empty -> "<release>-worker-enrollment"
    key: "token"
  # The worker stores its identity and unsent telemetry in this directory.
  # The default emptyDir survives a container restart in the same Pod. It
  # does not survive Pod deletion. An ephemeral PVC has the same lifetime,
  # but it can use cloud network storage. Kubernetes deletes that PVC with
  # the Pod. A new Pod gets a new PVC and a new worker identity.
  dataDir: /var/lib/reactorcide-worker
  dataDirEphemeralPVC:
    enabled: false
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # This older mode creates a retained PVC. Do not enable it together with
  # dataDirEphemeralPVC. It is only suitable for one worker replica.
  dataDirPersistence:
    enabled: false
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # Worker characteristics used for queue matching. Leave
  # os/arch empty to auto-detect from the running container (linux/amd64 for
  # the stock image).
  os: ""
  arch: ""
  # Free-form custom characteristics, each "key=value" (repeatable).
  custom: []
  workerVersion: ""

  # Settings used by KubernetesRunner for the per-Reactorcide-job Kubernetes Jobs.
  jobNamespace: ""
  jobServiceAccount: ""
  jobImagePullSecrets: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  # API token for job containers to submit triggers via the coordinator API.
  # The deploy script stores the API token in the apiTokenSecretName Secret.
  # Set to {} to disable API trigger submission (falls back to file-based triggers).
  apiTokenSecret:
    name: "base-reactorcide-api-token"
    key: "token"
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Builder sidecar configuration. Applied to any job that declares
# `capabilities: [builder]`. The sidecar runs buildkitd and the job container
# talks to it via BUILDKIT_HOST=tcp://localhost:1234, so jobs can build images
# without privileged mode or host socket access.
#
# Under KubernetesRunner:
#   - configMap: name of a ConfigMap whose "buildkitd.toml" key is mounted at
#     /etc/buildkit/buildkitd.toml inside the sidecar. Empty disables the mount.
#   - authSecret: name of a Secret whose "config.json" key is mounted at
#     /root/.docker/config.json (docker-format registry auth).
#   - cachePvc: name of a PVC mounted at /var/lib/buildkit for cross-job cache.
#     Empty means each sidecar starts fresh.
#
# Under DockerRunner / ContainerdRunner (docker-compose deploy), the same env
# vars point at HOST paths instead of k8s resource names.
builder:
  image: "moby/buildkit:v0.17.3"
  configMap: ""
  authSecret: ""
  cachePvc: ""

grpc:
  maxMessageSizeBytes: "1000000000"

postgres:
  uri: postgresql://devuser:devpass@reactorcide-postgresql:5432/reactorcide?sslmode=disable

# Corndogs task queue configuration
# Disabled by default - users should provide their own Corndogs in production
corndogs:
  enabled: false  # Set to true to deploy Corndogs subchart
  # External Corndogs URL - used when subchart is disabled but you have external Corndogs
  baseUrl: ""  # e.g., "http://corndogs.example.com:5080"
  replicaCount: 1
  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
  storage:
    backend: file
    file:
      dir: /data
      auditDir: ""
      auditChunkMB: "250"
      sync: group
      groupMaxBatch: "0"
      groupMaxDelay: "0s"
      persistence:
        enabled: true
        size: 10Gi
        storageClass: ""
        accessMode: ReadWriteOnce
        audit:
          enabled: false
          mountPath: /audit
          size: 10Gi
          storageClass: ""
          accessMode: ReadWriteOnce
  postgresql:
    enabled: false
  # Service configuration
  service:
    port: 5080

# Object storage configuration
# WARNING: Job logs/artifacts are stored here. The default 'filesystem' type is
# for DEVELOPMENT ONLY: it is backed by an emptyDir (the chart mounts one at
# basePath and sets fsGroup:1000 so the non-root coordinator can write), so data
# is LOST whenever the pod restarts.
# For production you MUST use 's3' (durable, recommended). NOTE: 'gcs' is NOT yet
# implemented in the coordinator -- s3 (incl. S3-compatible endpoints) is the
# only durable backend today.
objectStore:
  type: filesystem  # Options: filesystem (dev/ephemeral), s3 (production), memory (tests)
  bucket: reactorcide-objects
  basePath: /tmp/reactorcide-objects  # For filesystem type (emptyDir-backed, ephemeral - dev only)
  prefix: reactorcide/  # For s3 types
  # Zero keeps telemetry until its job is deleted. A positive value removes
  # logs and metrics for terminal jobs after this many days.
  telemetryRetentionDays: 0
  s3:
    accessKeyId: ""
    secretAccessKey: ""
    region: us-east-1
    endpoint: ""  # Leave empty for AWS S3, set for S3-compatible services
  gcs:
    serviceAccountJson: ""  # NOTE: gcs backend is not implemented yet; use s3

audit:
  # A positive value removes older audit events. Zero disables age-based
  # deletion.
  retentionDays: 365

# Default configuration
defaults:
  queueName: reactorcide-jobs
  timeout: 3600  # seconds
  # Default runner image for jobs that don't specify one
  # Set this to your registry's runnerlib image (e.g., "registry.example.com/reactorcide/runner:latest")
  runnerImage: ""
  orgName: "default"
  # Runnerlib PR evaluation layout: isolated or shared.
  checkoutMode: "isolated"
  # Secret name for the bootstrap API token.
  apiTokenSecretName: "base-reactorcide-api-token"

storage:
  type: postgres

# Secrets management configuration
# Database storage is the default and recommended for multi-tenant deployments.
# Local storage is only for single-user CLI deployments.
secrets:
  # Storage type: "database" (default), "local", or "none" to disable
  storageType: database
  # Master keys for encryption. Format: "name1:base64key1,name2:base64key2"
  # First key in the list is the primary key used for new encryptions.
  # Generate a key with: openssl rand -base64 32
  # IMPORTANT: In production, set this via external secret management, not in values.yaml
  masterKeys: ""  # e.g., "mk-2026-01:K7xZ9pQrStUvWxYz1234567890ABCDEF"
  # Reference an existing Kubernetes secret containing REACTORCIDE_MASTER_KEYS
  existingSecret: ""  # e.g., "reactorcide-master-keys"
  existingSecretKey: "master-keys"  # Key within the existing secret

# VCS (Version Control System) integration
vcs:
  # Enable VCS integration (required for webhook processing and commit status updates)
  enabled: false
  # Base URL of this Reactorcide instance, used for job links in commit statuses
  baseURL: ""

# Management UI auth, RBAC, and visibility (see docs/ui-auth.md for the full
# operator guide). Disabled ("none") by default: no login, public-view only.
uiAuth:
  # "none" (default, no login) | "local-rp" (DNS-less LinkKeys identity this
  # coordinator generates itself) | "rp" (app of a full LinkKeys RP deployment)
  mode: none
  # local-rp only: display name for this coordinator's generated identity.
  localRpName: ""
  # rp only: host:port TCP CSIL-RPC address of your LinkKeys RP server, and
  # comma-separated pinned SPKI SHA-256 fingerprints for its TLS certificate.
  linkkeysRpAddr: ""
  linkkeysRpFingerprints: ""
  # rp only, first boot: the RP server's API key. Presented once — the
  # coordinator persists it encrypted in the DB and the env var can be
  # dropped afterward. IMPORTANT: set via existingSecret in production, not
  # here in values.yaml.
  linkkeysRpApiKey: ""
  # Identity selector ([handle@]domain, or bare uuid@domain) granted global
  # admin the first time it completes a real login, while no admin exists yet.
  firstAdmin: ""
  # Comma-separated [handle@]domain selectors seeded into the login
  # admission list at startup (source=config). A bare domain admits any
  # handle at that domain.
  trustedIdentities: ""
  # The web UI's public base URL (what browsers reach the webapp on, e.g.
  # "https://ci.example.com") — required for local-rp/rp login to work.
  # NOT the coordinator's own URL; see docs/ui-auth.md.
  callbackURL: ""
  # One-time bootstrap-admin session token (visit /app/bootstrap) usable
  # only while no global admin exists yet. Leave empty to disable the
  # feature. IMPORTANT: set via existingSecret in production, not here.
  bootstrapAdminToken: ""
  # How long (seconds) a graceful job cancel waits before the worker force-
  # cleans up. Not used for kill (force-kill skips the grace period).
  cancelGraceSeconds: 60
  # Reference an existing Kubernetes secret for the two secret-bearing
  # values above instead of setting them directly (recommended for
  # production). Keys default to "rp-api-key" / "bootstrap-admin-token".
  existingSecret: ""
  existingSecretRpApiKeyKey: "rp-api-key"
  existingSecretBootstrapTokenKey: "bootstrap-admin-token"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# You could give a service account per service, but this is simpler for most use cases
# We did add _helpers entries to make this an easy exercise for the reader
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The base name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# The rest of these are also pretty standard, but are not implemented as separate template
# entries for simplicity reasons. These are for advanced security cases and for deployment
# styles you should avoid.
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000


nodeSelector: {}

tolerations: []

affinity: {}

# Bundled PostgreSQL - disabled by default
# Users should provide their own PostgreSQL in production
# Enable only for local development or testing
postgresql:
  enabled: false  # Disabled by default - use your own PostgreSQL
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  auth:
    username: "devuser"
    password: "devpass"
    database: "reactorcide"
  persistence:
    enabled: false  # Disabled by default for dev environments
    size: 10Gi
    storageClass: ""  # Use default storage class
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
