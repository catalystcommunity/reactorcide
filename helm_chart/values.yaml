app:
  enabled: true # enabled by default
  image:
    repository: containers.catalystsquad.com/public/reactorcide/coordinator
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion
    tag: "dev"
  prometheus:
    enabled: false
    path: /metrics
    port: 9000
    latencyHistogramsEnabled: true
  service:
    type: ClusterIP
    port: 6080
  # In-cluster coordinator API URL that job containers use to submit child jobs /
  # new workflows (injected as REACTORCIDE_COORDINATOR_URL by BuildJobEnv).
  # Empty = auto-derive "http://<app>.<namespace>.svc.cluster.local:<port>".
  jobApiUrl: ""
  # Secret holding the API token the coordinator injects into job containers as
  # REACTORCIDE_API_TOKEN (defaults to the deploy-managed user secret / "token"
  # key). The reference is optional so the coordinator starts even before the
  # token has been created. The WEB deployment no longer uses a token at all.
  apiTokenSecret:
    name: ""  # default: defaults.apiTokenSecretName
    key: ""   # default: "token"
  # Gateway API HTTPRoute configuration (routes /api/* and /csil/* to coordinator)
  gateway:
    enabled: false
    # List of domains to create HTTPRoutes for
    domains: []
    # Example:
    # domains:
    #   - reactorcide.example.com
    # Name of the Gateway resource to attach to
    gatewayName: ""
    # Namespace of the Gateway (optional, defaults to same namespace)
    gatewayNamespace: ""
    # Section name on the Gateway (listener name)
    sectionName: "https"
    # Additional annotations for the HTTPRoute
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  replicaCount: 1
  commitOnSuccess: true
  # Extra environment variables for the coordinator container. Each item is a
  # Kubernetes EnvVar: {name, value} or {name, valueFrom}. Use valueFrom with
  # a secretKeyRef for secret values. An item here overrides a key with the
  # same name from the coordinator ConfigMap. Example:
  #   extraEnv:
  #     - name: REACTORCIDE_ADMISSION_RESERVE_AFTER
  #       value: "10m"
  #     - name: REACTORCIDE_GITHUB_APP_API_URL
  #       valueFrom:
  #         configMapKeyRef: {name: my-settings, key: github-api-url}
  extraEnv: []
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

web:
  enabled: false # disabled by default
  image:
    repository: containers.catalystsquad.com/public/reactorcide/web
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion
    tag: "dev"
  service:
    type: ClusterIP
    port: 5080
  apiUrl: "http://reactorcideapp:6080"
  # The default in-cluster API URL uses HTTP. Set this to false when apiUrl
  # uses HTTPS.
  allowInsecureTransport: true
  # No API token: the web UI holds no coordinator credential. Every request it
  # makes carries the browser's own session instead, so there is nothing here to
  # over-privilege. Removing this from an existing values file is safe; leaving
  # a stale entry is harmless but has no effect.
  # Disables the Secure flag on the session cookie (see docs/ui-auth.md).
  # Only set this true if the web pod is reached over plain HTTP with no TLS
  # terminator in front of it (e.g. some local/dev setups) — leave false for
  # any real deployment, which must terminate TLS in front of this service.
  webCookieInsecure: false
  # Gateway API HTTPRoute configuration (routes /* to web UI)
  gateway:
    enabled: false
    # List of domains to create HTTPRoutes for
    domains: []
    # Example:
    # domains:
    #   - reactorcide.example.com
    # Name of the Gateway resource to attach to
    gatewayName: ""
    # Namespace of the Gateway (optional, defaults to same namespace)
    gatewayNamespace: ""
    # Section name on the Gateway (listener name)
    sectionName: "https"
    # Additional annotations for the HTTPRoute
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

worker:
  enabled: true
  image:
    repository: containers.catalystsquad.com/public/reactorcide/worker
    pullPolicy: Always
    tag: "dev"
  replicaCount: 1
  concurrency: 2    # concurrent leases (jobs) per worker pod
  metricsInterval: 2s
  storageMetricsInterval: 10s
  telemetrySendInterval: 10s
  telemetryBufferBatches: 12
  terminationGracePeriodSeconds: 3600
  containerRuntime: "auto"
  # Extra environment variables for the worker container, in the same form
  # as app.extraEnv ({name, value} or {name, valueFrom}). Use it for worker
  # settings that have no value in this file, for example
  # REACTORCIDE_WORKER_REGION or REACTORCIDE_WORKER_ZONE.
  extraEnv: []

  # --- Coordinator-mediated worker ---
  # The worker authenticates to the coordinator over CSIL-RPC and pulls work
  # through it; it has no direct corndogs, Postgres, or object-store
  # dependency of its own. See docs/workers.md ("Deploying workers") and
  # helm_chart/DEPLOYMENT.md for the full operator flow.
  #
  # In-cluster URL of the coordinator this worker registers with. Leave
  # empty to default to this release's coordinator Service
  # (http://<app-name>.<namespace>.svc.cluster.local:<app.service.port>);
  # only set this for out-of-cluster or cross-namespace workers.
  coordinatorUrl: ""
  # The default in-cluster Service uses HTTP. This explicit exception permits
  # credentials on that isolated connection. Set this to false when
  # coordinatorUrl uses HTTPS.
  allowInsecureTransport: true
  # Enrollment token (secret) -- ZERO-TOUCH by default.
  #
  # Leave enrollmentTokenSecret.name EMPTY (the default) and the chart
  # auto-provisions everything: it generates a stable enrollment token once
  # into a managed Secret (see managedEnrollmentTokenSecret below), the
  # coordinator seeds its default worker pool from that same token, and this
  # worker enrolls with it -- no kubectl, no admin-UI step, no manual Secret.
  # The token is generated in-cluster (randAlphaNum) and never written to
  # values.yaml or any committed file.
  #
  # OPERATOR OVERRIDE: to use a token you manage yourself (created via the
  # coordinator admin UI/CLI and stored with `kubectl create secret ...`),
  # set enrollmentTokenSecret.name to that Secret. When set, the chart does
  # NOT create the managed Secret, and both the worker and the coordinator
  # (its REACTORCIDE_DEFAULT_WORKER_ENROLLMENT_TOKEN) read your Secret instead.
  enrollmentTokenSecret:
    name: ""       # override: name of a Secret YOU manage; empty = auto-provision
    key: "token"   # key within that override secret holding the token
  # Managed (auto-generated) enrollment token Secret used when the override
  # above is unset. Rendered by templates/secret-worker-enrollment.yaml with
  # helm.sh/resource-policy: keep so the value survives upgrades/uninstalls.
  # Leave name empty to default to "<worker name>-enrollment".
  managedEnrollmentTokenSecret:
    name: ""       # empty -> "<worker name>-enrollment" (reactorcide-worker-enrollment)
    key: "token"
  # The worker stores its identity and unsent telemetry in this directory.
  # The default emptyDir survives a container restart in the same Pod. It
  # does not survive Pod deletion. An ephemeral PVC has the same lifetime,
  # but it can use cloud network storage. Kubernetes deletes that PVC with
  # the Pod. A new Pod gets a new PVC and a new worker identity.
  dataDir: /var/lib/reactorcide-worker
  dataDirEphemeralPVC:
    enabled: false
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # This older mode creates a retained PVC. Do not enable it together with
  # dataDirEphemeralPVC. It is only suitable for one worker replica.
  dataDirPersistence:
    enabled: false
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # Worker characteristics used for queue matching. Leave
  # os/arch empty to auto-detect from the running container (linux/amd64 for
  # the stock image).
  os: ""
  arch: ""
  # Free-form custom characteristics, each "key=value" (repeatable).
  custom: []
  workerVersion: ""

  # Settings used by KubernetesRunner for the per-Reactorcide-job Kubernetes Jobs.
  jobNamespace: ""
  jobServiceAccount: ""
  # Names of Kubernetes Secrets (type kubernetes.io/dockerconfigjson, in the
  # job namespace) added to EVERY generated job pod.
  jobImagePullSecrets: []
  # Names of Kubernetes Secrets a job MAY request with its own
  # image_pull_secrets list. A job-level name must be in this list or in
  # jobImagePullSecrets. With both lists empty, the worker rejects every
  # job-level image pull secret request.
  allowedJobImagePullSecrets: []
  # Where job CPU and memory go: "auto" (probe the API server once), "pod"
  # (spec.resources, shared by the job container and its buildkit/DinD
  # sidecars), or "container" (the job container only). Empty means "auto".
  jobResourceScope: ""
  # Maximum wait for a job's main container to start, including scheduling.
  jobStartupTimeout: "30m"
  # Use "disabled" only when no node autoscaler can add capacity.
  jobAutoscaling: "auto"
  # Node selector, tolerations, and affinity of job pods. The image
  # pre-seed DaemonSet uses the same values (docs/workers.md "Kubernetes
  # image pre-seed").
  jobNodeSelector: {}
  jobTolerations: []
  jobAffinity: {}
  # Image pre-seed DaemonSets. The name is a prefix (52 characters or
  # less, default "<worker name>-image-preseed"); each image set gets the
  # DaemonSet "<prefix>-<short hash>". Workers with the same set share it.
  imagePreseed:
    name: ""
    toolsImage: ""
    pauseImage: ""
    timeout: ""
  # Admission: how the worker decides to request more work. See
  # docs/workers.md "Resource-aware admission".
  #   concurrency (default): a fixed lease count, worker.concurrency.
  #   resources: request work only when the CPU and memory headroom has room
  #     for the job's CPU request and memory limit. Capacity is the
  #     allocatable CPU and memory of the eligible nodes, or the budget below.
  #     With a node autoscaler, set the budget to the largest pool size:
  #     current nodes grow only when Pods wait.
  admission:
    mode: "concurrency"
    # Upper bound of concurrent leases in resources mode (worker.concurrency
    # applies only to concurrency mode).
    maxLeases: 64
    # Optional budget, for example cpu: "64" and memory: "256Gi". Empty
    # uses the measured capacity.
    cpu: ""
    memory: ""
    # Label selector of the nodes that count toward capacity, for example
    # "reactorcide.io/pool=ci". Empty counts every Ready, schedulable node
    # with no NoSchedule or NoExecute taint.
    capacityNodeSelector: ""
  # Standard location characteristics. A job that does not require one
  # matches every worker. Empty region and zone are detected from the
  # topology.kubernetes.io labels of the nodes when every node agrees
  # (detectTopology). cloud is a free-form provider or site name.
  region: ""
  zone: ""
  cloud: ""
  detectTopology: true
  # Run jobs in a remote cluster. secretName names a Secret (in the release
  # namespace) whose key holds a kubeconfig file. The worker then creates job
  # Pods in that cluster, with the kubeconfig credentials, not with its own
  # service account. Empty uses the in-cluster config (the default).
  kubeconfig:
    secretName: ""
    key: "config"
    context: ""
  # Coordinator API address for job Pods (trigger submission). Empty uses
  # this release's in-cluster Service. Set it for a remote cluster.
  jobApiUrl: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  # API token for job containers to submit triggers via the coordinator API.
  # The deploy script stores the API token in the apiTokenSecretName Secret.
  # Set to {} to disable API trigger submission (falls back to file-based triggers).
  apiTokenSecret:
    name: "base-reactorcide-api-token"
    key: "token"
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Builder sidecar configuration. Applied to any job that declares
# `capabilities: [builder]`. The sidecar runs buildkitd and the job container
# talks to it via BUILDKIT_HOST=tcp://localhost:1234, so jobs can build images
# without privileged mode or host socket access.
#
# Under KubernetesRunner:
#   - configMap: name of a ConfigMap whose "buildkitd.toml" key is mounted at
#     /etc/buildkit/buildkitd.toml inside the sidecar. Empty disables the mount.
#   - authSecret: name of a Secret whose "config.json" key is mounted at
#     /root/.docker/config.json (docker-format registry auth).
#   - cachePvc: name of a PVC mounted at /var/lib/buildkit for cross-job cache.
#     Empty means each sidecar starts fresh. The shared cache namespace
#     ("standard" by default) uses the sub path shared/ of the claim. Each
#     other cache namespace uses the sub path namespaces/<key> of the same
#     claim. A job
#     with no cache writes gets no cache mount. Use a ReadWriteMany claim when
#     builder pods run on more than one node. See docs/builds-and-caches.md.
#   - rootless: run buildkitd with the rootless image (moby/buildkit:*-rootless),
#     uid 1000, no privilege, and Unconfined seccomp and AppArmor profiles.
#     Off by default (privileged root). When on and image is the default
#     image, the worker uses moby/buildkit:v0.17.3-rootless.
#
# Under DockerRunner / ContainerdRunner (docker-compose deploy), the same env
# vars point at HOST paths instead of k8s resource names.
builder:
  image: "moby/buildkit:v0.17.3"
  configMap: ""
  authSecret: ""
  cachePvc: ""
  rootless: false

# Egress proxy (docs/egress-proxy.md). Disabled by default: no job network
# changes. When enabled, the chart runs the proxy (Deployment + Service) and
# gives the worker the REACTORCIDE_EGRESS_* settings, so the worker gets the
# characteristic egress_proxy=true. Jobs use the proxy only when egress
# control is on for their organization, project, or execution profile, or
# when they use a secret grant with delivery "proxy".
egressProxy:
  enabled: false
  image:
    repository: containers.catalystsquad.com/public/reactorcide/egress
    pullPolicy: IfNotPresent
    tag: "dev"
  replicaCount: 1
  # Name of a Secret YOU create (never put the values in values.yaml), with
  # the keys ca.crt, ca.key, job.key, and control.token. Make them with the
  # proxy image: reactorcide-egress ca --out DIR; reactorcide-egress key
  # --out DIR/job.key; reactorcide-egress control-token --out DIR/control.token.
  # Required when enabled.
  secretName: ""
  # Optional Secret whose keys are operator secrets for WASM plugins and the
  # SSH proxy (REACTORCIDE_EGRESS_SECRETS_DIR). Job secrets do not go here.
  secretsDirSecret: ""
  # Global policy (JSON, no secret values): destinations every job with
  # egress control may reach, passthrough, decode depth, stream hosts,
  # plugins. Example: {"destinations": [{"host": "*.pypi.org"}]}.
  policy:
    destinations: []
  # Let a job that the worker did not register use the proxy with only the
  # global policy. Keep false; a VM worker that sends all guest traffic to
  # the proxy can need it.
  allowUnregistered: false
  service:
    proxyPort: 3128
    controlPort: 8080
  # Image of the network helper of job pods (egress-net init container and
  # egress-forward sidecar). Empty uses the proxy image.
  netImage: ""
  # The control API carries the secret values of proxy grants. With
  # controlTLS.enabled the proxy serves it over TLS with a certificate from
  # its CA (for the service name), and the worker trusts only that CA.
  controlTLS:
    enabled: true
  # NetworkPolicies (on by default with the egress proxy; needs a CNI that
  # enforces NetworkPolicy):
  #   - job pods with egress control (label reactorcide.io/egress=proxy):
  #     egress only to the proxy port, and no ingress at all. The nft
  #     redirect and input filter in the pod already enforce this; the
  #     policy is a second layer.
  #   - the proxy pods: the control port only from worker pods, the proxy
  #     port only from egress job pods (and proxyClients).
  networkPolicy:
    enabled: true
    # More peers (NetworkPolicy "from" entries) that may use the proxy port,
    # for example the hosts of VM workers: [{ipBlock: {cidr: 10.0.5.0/24}}].
    proxyClients: []
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

grpc:
  maxMessageSizeBytes: "1000000000"

postgres:
  uri: postgresql://devuser:devpass@reactorcide-postgresql:5432/reactorcide?sslmode=disable

# Corndogs task queue configuration
# Disabled by default - users should provide their own Corndogs in production
#
# Known limit: keep corndogs.resilience.submissionKeyPolicy at
# "compatibility" (the subchart default). Reactorcide submits jobs without a
# submission key (coordinator_api/internal/corndogs/client.go), so a Corndogs
# server with CORNDOGS_SUBMISSION_KEY_POLICY=required refuses each job. This
# also applies to an external Corndogs (corndogs.enabled: false).
corndogs:
  enabled: false  # Set to true to deploy Corndogs subchart
  # External Corndogs URL - used when subchart is disabled but you have external Corndogs
  # A CSIL-RPC TCP address (host:port). A URL scheme is removed.
  baseUrl: ""  # e.g., "corndogs.example.com:5080"
  replicaCount: 1
  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
  storage:
    backend: file
    file:
      dir: /data
      auditDir: ""
      auditChunkMB: "250"
      sync: group
      groupMaxBatch: "0"
      groupMaxDelay: "0s"
      persistence:
        enabled: true
        size: 10Gi
        storageClass: ""
        accessMode: ReadWriteOnce
        audit:
          enabled: false
          mountPath: /audit
          size: 10Gi
          storageClass: ""
          accessMode: ReadWriteOnce
  postgresql:
    enabled: false
  # Service configuration
  service:
    port: 5080

# Object storage configuration
# WARNING: Job logs/artifacts are stored here. The default 'filesystem' type is
# for DEVELOPMENT ONLY: it is backed by an emptyDir (the chart mounts one at
# basePath and sets fsGroup:1000 so the non-root coordinator can write), so data
# is LOST whenever the pod restarts.
# For production you MUST use 's3' (durable, recommended). NOTE: 'gcs' is NOT yet
# implemented in the coordinator -- s3 (incl. S3-compatible endpoints) is the
# only durable backend today.
objectStore:
  type: filesystem  # Options: filesystem (dev/ephemeral), s3 (production), memory (tests)
  bucket: reactorcide-objects
  basePath: /tmp/reactorcide-objects  # For filesystem type (emptyDir-backed, ephemeral - dev only)
  prefix: reactorcide/  # For s3 types
  # Zero keeps telemetry until its job is deleted. A positive value removes
  # logs and metrics for terminal jobs after this many days.
  telemetryRetentionDays: 0
  s3:
    accessKeyId: ""
    secretAccessKey: ""
    region: us-east-1
    endpoint: ""  # Leave empty for AWS S3, set for S3-compatible services
  gcs:
    serviceAccountJson: ""  # NOTE: gcs backend is not implemented yet; use s3

audit:
  # A positive value removes older audit events. Zero disables age-based
  # deletion.
  retentionDays: 365

# Default configuration
defaults:
  queueName: reactorcide-jobs
  timeout: 3600  # seconds
  # Default runner image for jobs that don't specify one
  # Set this to your registry's runnerlib image (e.g., "registry.example.com/reactorcide/runner:latest")
  runnerImage: ""
  orgName: "default"
  # Runnerlib PR evaluation layout: isolated or shared.
  checkoutMode: "isolated"
  # Secret name for the bootstrap API token.
  apiTokenSecretName: "base-reactorcide-api-token"

# Coordinator settings added in 0.13 (docs/upgrade-0.13.md). An empty value
# ("" or null) does not set the variable, so the coordinator uses its code
# default (shown in each comment). The values go into the coordinator
# ConfigMap.
oidc:
  # REACTORCIDE_OIDC_ISSUER_URL: the HTTPS issuer URL, for example
  # "https://ci.example.com/api/v1/oidc". Empty
  # (default) disables the OIDC issuer for jobs (docs/oidc.md).
  issuerUrl: ""
rateLimits:
  # REACTORCIDE_WEBHOOK_RATE_LIMIT_PER_MINUTE (default 600, per project, per
  # replica; 0 disables) and REACTORCIDE_WEBHOOK_RATE_LIMIT_BURST (200).
  webhookPerMinute: ""
  webhookBurst: ""
  # REACTORCIDE_API_RATE_LIMIT_PER_MINUTE (default 0 = off) and
  # REACTORCIDE_API_RATE_LIMIT_BURST (300).
  apiPerMinute: ""
  apiBurst: ""
  # REACTORCIDE_TRUSTED_PROXY_CIDRS (default empty = the TCP peer). The
  # CIDRs of your ingress or proxy pods, for example "10.42.0.0/16". When the
  # TCP peer is in this list, the federation source limit uses the
  # right-most X-Forwarded-For address that is not in it (docs/federation.md).
  trustedProxyCIDRs: ""
outboundEvents:
  # REACTORCIDE_OUTBOUND_EVENTS_ENABLED (default true). Set false to stop
  # outbound event delivery (docs/outbound-events.md).
  enabled: ""
  # REACTORCIDE_OUTBOUND_EVENTS_ALLOWED_NETWORKS: comma-separated CIDRs or
  # addresses that are private or loopback but that webhooks can reach.
  # Default empty: webhooks reach only public addresses.
  allowedNetworks: ""
observability:
  # REACTORCIDE_OBSERVABILITY_ENABLED (default true): rollup and alert loops
  # (docs/observability.md).
  enabled: ""
  # REACTORCIDE_OBSERVABILITY_INTERVAL_SECONDS (60) and
  # REACTORCIDE_OBSERVABILITY_ALERT_INTERVAL_SECONDS (300).
  intervalSeconds: ""
  alertIntervalSeconds: ""
  # REACTORCIDE_ROLLUP_HOURLY_RETENTION_DAYS (35) and
  # REACTORCIDE_ROLLUP_DAILY_RETENTION_DAYS (400).
  rollupHourlyRetentionDays: ""
  rollupDailyRetentionDays: ""
artifacts:
  # REACTORCIDE_ARTIFACTS_ENABLED (default true) and the limits
  # REACTORCIDE_ARTIFACT_MAX_FILE_BYTES (256 MiB), _MAX_JOB_BYTES (1 GiB),
  # and _MAX_FILES (1000) (docs/artifacts-and-tests.md).
  enabled: ""
  maxFileBytes: ""
  maxJobBytes: ""
  maxFiles: ""
  # REACTORCIDE_FLAKY_WINDOW_DAYS (default 30): the window of the flaky test
  # detection.
  flakyWindowDays: ""
provenance:
  # REACTORCIDE_PROVENANCE_ENABLED: false turns provenance off. Empty keeps it
  # on when a builder ID is known.
  enabled: ""
  # REACTORCIDE_PROVENANCE_BUILDER_ID. Empty uses the OIDC issuer URL
  # (docs/provenance.md).
  builderId: ""
cache:
  # REACTORCIDE_CACHE_SHARED_NAMESPACE. null (default) does not set it, so
  # the shared builder cache volume belongs to the "standard" namespace. An
  # empty string "" turns the shared volume off (docs/builds-and-caches.md).
  sharedNamespace: null
groupVcsSync:
  # REACTORCIDE_GROUP_VCS_SYNC_INTERVAL (Go duration, default 15m; 0
  # disables the sync of groups linked to VCS teams).
  interval: ""

# Metrics objects for the Prometheus Operator.
metrics:
  prometheusRule:
    # Make a PrometheusRule with the CI owner alerts of
    # deployment/prometheus/reactorcide-ci-owner-alerts.yaml. Needs the
    # PrometheusRule CRD. Off by default.
    enabled: false
    # Extra labels, for example the label that your Prometheus selects.
    labels: {}

storage:
  type: postgres

# Secrets management configuration
# Database storage is the default and recommended for multi-tenant deployments.
# Local storage is only for single-user CLI deployments.
secrets:
  # Storage type: "database" (default), "local", or "none" to disable
  storageType: database
  # Master keys for encryption. Format: "name1:base64key1,name2:base64key2"
  # First key in the list is the primary key used for new encryptions.
  # Generate a key with: openssl rand -base64 32
  # IMPORTANT: In production, set this via external secret management, not in values.yaml
  masterKeys: ""  # e.g., "mk-2026-01:K7xZ9pQrStUvWxYz1234567890ABCDEF"
  # Reference an existing Kubernetes secret containing REACTORCIDE_MASTER_KEYS
  existingSecret: ""  # e.g., "reactorcide-master-keys"
  existingSecretKey: "master-keys"  # Key within the existing secret

# VCS (Version Control System) integration
vcs:
  # Enable VCS integration (required for webhook processing and commit status updates)
  enabled: false
  # Base URL of this Reactorcide instance, used for job links in commit statuses
  baseURL: ""

# Management UI auth, RBAC, and visibility (see docs/ui-auth.md for the full
# operator guide). Disabled ("none") by default: no login, public-view only.
uiAuth:
  # "none" (default, no login) | "local-rp" (DNS-less LinkKeys identity this
  # coordinator generates itself) | "rp" (app of a full LinkKeys RP deployment)
  mode: none
  # local-rp only: display name for this coordinator's generated identity.
  localRpName: ""
  # rp only: host:port TCP CSIL-RPC address of your LinkKeys RP server, and
  # comma-separated pinned SPKI SHA-256 fingerprints for its TLS certificate.
  # The coordinator dials this address itself, so it must be reachable from
  # the coordinator pod. A public hostname often resolves to a load-balancer
  # IP that pods cannot reach; prefer the in-cluster service address, e.g.
  # "linkkeys-example.linkkeys-example.svc.cluster.local:4987". The
  # fingerprint pin, not the hostname, is the trust anchor.
  linkkeysRpAddr: ""
  linkkeysRpFingerprints: ""
  # rp only, optional: the LinkKeys application_id sent on sign-request
  # (1-128 of A-Z a-z 0-9 - _ .). Empty: the RP server uses the API-key
  # account username. Users consent per application, so keep it stable.
  linkkeysRpApplicationId: ""
  # rp only, first boot: the RP server's API key. Presented once — the
  # coordinator persists it encrypted in the DB and the env var can be
  # dropped afterward. IMPORTANT: set via existingSecret in production, not
  # here in values.yaml.
  linkkeysRpApiKey: ""
  # Identity selector ([handle@]domain, or bare uuid@domain) granted global
  # admin the first time it completes a real login, while no admin exists yet.
  firstAdmin: ""
  # Comma-separated [handle@]domain selectors seeded into the login
  # admission list at startup (source=config). A bare domain admits any
  # handle at that domain.
  trustedIdentities: ""
  # The web UI's public base URL (what browsers reach the webapp on, e.g.
  # "https://ci.example.com") — required for local-rp/rp login to work.
  # NOT the coordinator's own URL; see docs/ui-auth.md.
  callbackURL: ""
  # One-time bootstrap-admin session token (visit /app/bootstrap) usable
  # only while no global admin exists yet. Leave empty to disable the
  # feature. IMPORTANT: set via existingSecret in production, not here.
  bootstrapAdminToken: ""
  # How long (seconds) a graceful job cancel waits before the worker force-
  # cleans up. Not used for kill (force-kill skips the grace period).
  cancelGraceSeconds: 60
  # Reference an existing Kubernetes secret for the two secret-bearing
  # values above instead of setting them directly (recommended for
  # production). Keys default to "rp-api-key" / "bootstrap-admin-token".
  existingSecret: ""
  existingSecretRpApiKeyKey: "rp-api-key"
  existingSecretBootstrapTokenKey: "bootstrap-admin-token"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# You could give a service account per service, but this is simpler for most use cases
# We did add _helpers entries to make this an easy exercise for the reader
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The base name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# The rest of these are also pretty standard, but are not implemented as separate template
# entries for simplicity reasons. These are for advanced security cases and for deployment
# styles you should avoid.
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000


nodeSelector: {}

tolerations: []

affinity: {}

# Bundled PostgreSQL - disabled by default
# Users should provide their own PostgreSQL in production
# Enable only for local development or testing
postgresql:
  enabled: false  # Disabled by default - use your own PostgreSQL
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  auth:
    username: "devuser"
    password: "devpass"
    database: "reactorcide"
  persistence:
    enabled: false  # Disabled by default for dev environments
    size: 10Gi
    storageClass: ""  # Use default storage class
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
