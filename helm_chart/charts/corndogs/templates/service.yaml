apiVersion: v1
kind: Service
metadata:
  name: {{ include "corndogs.fullname" . }}
  labels:
    {{- include "corndogs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: corndogshttp
      protocol: TCP
      name: corndogshttp
    # 0.7.0 ops HTTP (/healthz + /metrics). Always exposed: 5080 is raw TCP RPC
    # in 0.7.0, so health checks and the helm test must use this port.
    - port: 8080
      targetPort: corndogsops
      protocol: TCP
      name: corndogsops
  selector:
    {{- include "corndogs.selectorLabels" . | nindent 4 }}
