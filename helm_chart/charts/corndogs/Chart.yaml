apiVersion: v2
name: corndogs
description: A Helm chart for corndogs, the cloud-native task-state service
keywords:
  - corndogs
  - task-queue
  - task-state

type: application
version: "0.6.0"
# 0.7.0 = CSIL-RPC over TCP on :5080 (no HTTP RPC); /healthz + /metrics moved
# to the ops HTTP port :8080. Must match the coordinator's TCP StreamCarrier
# client and the VM compose (corndogs:0.7.0).
appVersion: "0.7.0"


dependencies:
  - name: postgresql
    version: ~12.1.6
    repository: https://charts.bitnami.com/bitnami/
    condition: postgresql.enabled
