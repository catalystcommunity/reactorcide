# Default chart values.

replicaCount: 1
namespace: corndogs

image:
  repository: containers.catalystsquad.com/public/catalystcommunity/corndogs
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # Add resource limits and requests for your environment.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

appconfig:
  loglevel: "error"
  prometheusEnabled: false
  # Maximum payload size in bytes. Valid values are 1 through 1073741823.
  maxPayloadBytes: "16777216"

livenessProbe:
  # Delay liveness checks while Corndogs waits for its storage backend.
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  # Start readiness checks immediately. The pod stays out of service until the
  # storage backend is ready and the server starts.
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

# Create a CronJob that sends CleanUpTimedOut requests.
timeoutCron:
  enabled: false
  # Set a standard Cron schedule.
  # schedule:

  # Set the service host. The default is the chart full name.
  # address: corndogs

  # Set the service port. The default is service.port.
  # port: 5080

  # Set a queue to process only that queue.
  # queue: example

  # Set the pod restart policy.
  # restartPolicy: Never


# tls serves the CSIL-RPC port (5080) with TLS only. The ops port (8080:
# /healthz, /metrics) stays plain HTTP.
#   secretName     : a kubernetes.io/tls Secret with tls.crt and tls.key, for
#                    example from cert-manager. The certificate must be valid
#                    for each name that clients use (the Service DNS names).
#   reloadInterval : how often Corndogs examines the files for a new
#                    certificate. A Secret update needs no pod restart.
#   caKey          : a key in the same Secret that holds the CA certificate
#                    (cert-manager writes ca.crt). The timeout CronJob uses it
#                    to verify the server. Empty: the system roots.
#   serverName     : the name that the timeout CronJob verifies in the server
#                    certificate. Empty: the CronJob address.
tls:
  enabled: false
  secretName: ""
  mountPath: /etc/corndogs/tls
  reloadInterval: 10s
  caKey: ""
  serverName: ""

# storage selects the backend:
#   postgres (default) : the shared, horizontally-scalable backend.
#   file               : an embedded, single-process bbolt backend, with no
#                        separate database to operate.
#
# The file backend is SINGLE-REPLICA ONLY (the data file is owned by one
# process). The chart refuses to install when backend is "file" together with
# replicaCount > 1 or autoscaling enabled. When using "file", also set
# postgresql.enabled=false (and zalando_postgres.enabled=false) so no database
# is deployed alongside it.
storage:
  backend: postgres
  file:
    # dir       : where the embedded data file lives (a PVC is mounted here).
    dir: /data
    # auditDir  : where the append-only audit log is written. Empty => same as
    #             dir. Set to a separate path (with persistence.audit.enabled)
    #             to put the audit log on its own volume.
    auditDir: ""
    # auditChunkMB : roll the audit log to a new segment file (audit-NNNNNN.log)
    #               once the active one reaches this many MB ("0" = never roll).
    auditChunkMB: "250"
    # sync      : durability mode.
    #               group    (default) durable + fast, via group commit
    #               always   durable, one fsync per write
    #               interval ~1s window, may lose the last second on crash
    #               never    no fsync, durability left to the OS
    sync: group
    # groupMaxBatch : cap on writes coalesced per fsync (0 = unbounded).
    groupMaxBatch: "0"
    # groupMaxDelay : linger to widen batches, e.g. "200us" (0 = off).
    groupMaxDelay: "0s"
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
      accessMode: ReadWriteOnce
      # audit : optionally put the audit log on its own PVC. When enabled, set
      #         file.auditDir to its mountPath (default /audit).
      audit:
        enabled: false
        mountPath: /audit
        size: 10Gi
        storageClass: ""
        accessMode: ReadWriteOnce

database:
  dbname: "postgres"
  host: "corndogs-postgresql"
  user: "postgres"
  password: "postgres"
  # Time to wait for Postgres to accept connections before Corndogs exits.
  startupTimeoutSeconds: "120"
  maxIdleConns: "10"
  maxOpenConns: "10"
  connMaxLifetimeSeconds: "3600"
  tls:
    enabled: false

postgresql:
  fullnameOverride: corndogs-postgresql
  enabled: true
  # this makes local dev and default installation smooth, but don't run this in production
  auth:
    enablePostgresUser: true
    postgresPassword: postgres
  tls:
    enabled: false
  # disable persistence by default
  primary:
    persistence:
      enabled: false

zalando_postgres:
  enabled: false
  spec:
    teamId: "postgres"
    numberOfInstances: 1
    volume:
      size: 100Mb
    postgresql:
      version: "15"
      parameters:
        max_connections: "250"
    enableLogicalBackup: false
    logicalBackupSchedule: "00 05 * * *"

serviceMonitor:
  enabled: false
  namespaceSelector: {}
  annotations: {}
  labels: {}
  interval: null
  scrapeTimeout: null
  relabelings: []
