{{- if .Values.worker.enabled }}
{{- if and .Values.worker.dataDirPersistence.enabled .Values.worker.dataDirEphemeralPVC.enabled }}
{{- fail "worker.dataDirPersistence.enabled and worker.dataDirEphemeralPVC.enabled cannot both be true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.name" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "worker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "worker.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "worker.name" . }}
          # The worker image ENTRYPOINT is ["/reactorcide", "worker"] (see
          # deployment/Dockerfile.worker), so args must be flags ONLY. A stray
          # leading "worker" here made the command "/reactorcide worker worker
          # --coordinator-url ..."; urfave/cli v2 stops flag parsing at that
          # extra positional, leaving --coordinator-url unparsed -> the worker
          # exits "coordinator-url is required" -> CrashLoop.
          args:
            - --coordinator-url
            - {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "app.name" .) .Release.Namespace .Values.app.service.port) .Values.worker.coordinatorUrl | quote }}
            {{- if .Values.worker.allowInsecureTransport }}
            - --allow-insecure-transport
            {{- end }}
            {{- if .Values.worker.os }}
            - --os
            - {{ .Values.worker.os | quote }}
            {{- end }}
            {{- if .Values.worker.arch }}
            - --arch
            - {{ .Values.worker.arch | quote }}
            {{- end }}
            {{- if .Values.worker.workerVersion }}
            - --worker-version
            - {{ .Values.worker.workerVersion | quote }}
            {{- end }}
            {{- range .Values.worker.custom }}
            - --custom
            - {{ . | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- if .Values.worker.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep -v grep | grep worker"
            initialDelaySeconds: {{ .Values.worker.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.worker.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.worker.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          # Coordinator-mediated worker: the worker's only
          # dependency is an authenticated CSIL-RPC connection to the
          # coordinator, so -- unlike the app deployment -- it does NOT pull
          # in the shared app configmap/secret (no corndogs, DB, object-store,
          # or master-key config belongs here). Secrets needed by leased jobs
          # are resolved by the coordinator and delivered over that
          # authenticated channel, never via worker pod env.
          env:
            - name: REACTORCIDE_WORKER_DATA_DIR
              value: {{ .Values.worker.dataDir | quote }}
            - name: REACTORCIDE_CONTAINER_RUNTIME
              value: {{ .Values.worker.containerRuntime | quote }}
            {{- $admissionMode := default "concurrency" (.Values.worker.admission).mode }}
            {{- if not (has $admissionMode (list "concurrency" "resources")) }}
            {{- fail "worker.admission.mode must be concurrency or resources" }}
            {{- end }}
            - name: REACTORCIDE_WORKER_CONCURRENCY
              {{- if eq $admissionMode "resources" }}
              value: {{ default 64 .Values.worker.admission.maxLeases | quote }}
              {{- else }}
              value: {{ .Values.worker.concurrency | quote }}
              {{- end }}
            {{- if eq $admissionMode "resources" }}
            - name: REACTORCIDE_WORKER_ADMISSION
              value: "resources"
            {{- with .Values.worker.admission.cpu }}
            - name: REACTORCIDE_WORKER_ADMISSION_CPU
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.admission.memory }}
            - name: REACTORCIDE_WORKER_ADMISSION_MEMORY
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with (.Values.worker.admission).capacityNodeSelector }}
            - name: REACTORCIDE_K8S_CAPACITY_NODE_SELECTOR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.region }}
            - name: REACTORCIDE_WORKER_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.zone }}
            - name: REACTORCIDE_WORKER_ZONE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.cloud }}
            - name: REACTORCIDE_WORKER_CLOUD
              value: {{ . | quote }}
            {{- end }}
            {{- if eq (toString .Values.worker.detectTopology) "false" }}
            - name: REACTORCIDE_WORKER_DETECT_TOPOLOGY
              value: "false"
            {{- end }}
            {{- if (.Values.worker.kubeconfig).secretName }}
            - name: REACTORCIDE_K8S_KUBECONFIG
              value: "/etc/reactorcide/kubeconfig/{{ default "config" .Values.worker.kubeconfig.key }}"
            {{- with .Values.worker.kubeconfig.context }}
            - name: REACTORCIDE_K8S_CONTEXT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: REACTORCIDE_WORKER_METRICS_INTERVAL
              value: {{ .Values.worker.metricsInterval | quote }}
            - name: REACTORCIDE_WORKER_STORAGE_METRICS_INTERVAL
              value: {{ .Values.worker.storageMetricsInterval | quote }}
            - name: REACTORCIDE_WORKER_TELEMETRY_SEND_INTERVAL
              value: {{ .Values.worker.telemetrySendInterval | quote }}
            - name: REACTORCIDE_WORKER_TELEMETRY_BUFFER_BATCHES
              value: {{ .Values.worker.telemetryBufferBatches | quote }}
            {{- /* Enrollment token (secret): required to Register with the
            coordinator. Sourced from the enrollment Secret -- either the
            operator override (worker.enrollmentTokenSecret.name) or the
            chart-managed, auto-generated Secret (secret-worker-enrollment.yaml).
            The SAME Secret/key is read by the coordinator deployment as
            REACTORCIDE_DEFAULT_WORKER_ENROLLMENT_TOKEN, so both sides always
            agree on the token value. See values.yaml worker.enrollmentTokenSecret. */}}
            - name: REACTORCIDE_WORKER_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.enrollmentSecretName" . }}
                  key: {{ include "worker.enrollmentSecretKey" . }}
            {{- /* API token for job containers to submit triggers */ -}}
            {{- if .Values.worker.apiTokenSecret }}
            - name: REACTORCIDE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.apiTokenSecret.name }}
                  key: {{ .Values.worker.apiTokenSecret.key | default "token" }}
                  optional: true
            {{- end }}
            # API URL for job containers to submit triggers (reachable from job pods)
            - name: REACTORCIDE_JOB_API_URL
              value: {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "app.name" .) .Release.Namespace .Values.app.service.port) .Values.worker.jobApiUrl | quote }}
            {{- if .Values.worker.jobNamespace }}
            - name: REACTORCIDE_K8S_JOB_NAMESPACE
              value: {{ .Values.worker.jobNamespace | quote }}
            {{- end }}
            - name: REACTORCIDE_K8S_JOB_SERVICE_ACCOUNT
              value: {{ default (include "worker.serviceAccountName" .) .Values.worker.jobServiceAccount | quote }}
            {{- if .Values.worker.jobImagePullSecrets }}
            - name: REACTORCIDE_K8S_JOB_IMAGE_PULL_SECRETS
              value: {{ join "," .Values.worker.jobImagePullSecrets | quote }}
            {{- end }}
            {{- if .Values.worker.allowedJobImagePullSecrets }}
            - name: REACTORCIDE_K8S_JOB_ALLOWED_IMAGE_PULL_SECRETS
              value: {{ join "," .Values.worker.allowedJobImagePullSecrets | quote }}
            {{- end }}
            {{- if .Values.worker.jobResourceScope }}
            - name: REACTORCIDE_K8S_JOB_RESOURCE_SCOPE
              value: {{ .Values.worker.jobResourceScope | quote }}
            {{- end }}
            - name: REACTORCIDE_K8S_JOB_STARTUP_TIMEOUT
              value: {{ default "30m" .Values.worker.jobStartupTimeout | quote }}
            - name: REACTORCIDE_K8S_JOB_AUTOSCALING
              value: {{ default "auto" .Values.worker.jobAutoscaling | quote }}
            {{- if .Values.worker.jobNodeSelector }}
            - name: REACTORCIDE_K8S_JOB_NODE_SELECTOR
              value: {{ $pairs := list }}{{ range $k, $v := .Values.worker.jobNodeSelector }}{{ $pairs = append $pairs (printf "%s=%s" $k $v) }}{{ end }}{{ join "," $pairs | quote }}
            {{- end }}
            {{- if .Values.worker.jobTolerations }}
            - name: REACTORCIDE_K8S_JOB_TOLERATIONS
              value: {{ toJson .Values.worker.jobTolerations | quote }}
            {{- end }}
            {{- if .Values.worker.jobAffinity }}
            - name: REACTORCIDE_K8S_JOB_AFFINITY
              value: {{ toJson .Values.worker.jobAffinity | quote }}
            {{- end }}
            {{- $preseed := .Values.worker.imagePreseed | default dict }}
            - name: REACTORCIDE_K8S_IMAGE_PRESEED_NAME
              value: {{ default (printf "%s-image-preseed" (include "worker.name" .)) $preseed.name | trunc 52 | trimSuffix "-" | quote }}
            {{- if $preseed.toolsImage }}
            - name: REACTORCIDE_K8S_IMAGE_PRESEED_TOOLS_IMAGE
              value: {{ $preseed.toolsImage | quote }}
            {{- end }}
            {{- if $preseed.pauseImage }}
            - name: REACTORCIDE_K8S_IMAGE_PRESEED_PAUSE_IMAGE
              value: {{ $preseed.pauseImage | quote }}
            {{- end }}
            {{- if $preseed.timeout }}
            - name: REACTORCIDE_K8S_IMAGE_PRESEED_TIMEOUT
              value: {{ $preseed.timeout | quote }}
            {{- end }}
            {{- /* Builder sidecar config — applied to jobs with `capabilities: [builder]` */ -}}
            {{- if .Values.builder }}
            {{- if .Values.builder.image }}
            - name: REACTORCIDE_BUILDER_IMAGE
              value: {{ .Values.builder.image | quote }}
            {{- end }}
            {{- if .Values.builder.configMap }}
            - name: REACTORCIDE_BUILDER_CONFIG_PATH
              value: {{ .Values.builder.configMap | quote }}
            {{- end }}
            {{- if .Values.builder.authSecret }}
            - name: REACTORCIDE_BUILDER_REGISTRY_AUTH_PATH
              value: {{ .Values.builder.authSecret | quote }}
            {{- end }}
            {{- if .Values.builder.cachePvc }}
            - name: REACTORCIDE_BUILDER_CACHE_VOLUME
              value: {{ .Values.builder.cachePvc | quote }}
            {{- end }}
            {{- if .Values.builder.rootless }}
            - name: REACTORCIDE_BUILDER_ROOTLESS
              value: "true"
            {{- end }}
            {{- end }}
            {{- if .Values.egressProxy.enabled }}
            {{- /* Egress proxy settings (docs/egress-proxy.md). */}}
            - name: REACTORCIDE_EGRESS_CONTROL_URL
              value: "{{ if .Values.egressProxy.controlTLS.enabled }}https{{ else }}http{{ end }}://{{ include "egress.host" . }}:{{ .Values.egressProxy.service.controlPort }}"
            - name: REACTORCIDE_EGRESS_PROXY_ADDR
              value: "{{ include "egress.host" . }}:{{ .Values.egressProxy.service.proxyPort }}"
            - name: REACTORCIDE_EGRESS_CONTROL_TOKEN_FILE
              value: /etc/reactorcide/egress/control.token
            - name: REACTORCIDE_EGRESS_JOB_KEY_FILE
              value: /etc/reactorcide/egress/job.key
            - name: REACTORCIDE_EGRESS_CA_FILE
              value: /etc/reactorcide/egress/ca.crt
            - name: REACTORCIDE_EGRESS_NET_IMAGE
              value: {{ default (printf "%s:%s" .Values.egressProxy.image.repository (.Values.egressProxy.image.tag | default .Chart.AppVersion)) .Values.egressProxy.netImage | quote }}
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: work-dir
              mountPath: /tmp/reactorcide-jobs
            {{- if .Values.egressProxy.enabled }}
            - name: egress-worker
              mountPath: /etc/reactorcide/egress
              readOnly: true
            {{- end }}
            - name: worker-data
              mountPath: {{ .Values.worker.dataDir }}
            {{- if (.Values.worker.kubeconfig).secretName }}
            - name: kubeconfig
              mountPath: /etc/reactorcide/kubeconfig
              readOnly: true
            {{- end }}
      volumes:
        - name: work-dir
          emptyDir: {}
        {{- if .Values.egressProxy.enabled }}
        - name: egress-worker
          secret:
            secretName: {{ .Values.egressProxy.secretName }}
            defaultMode: 0400
            # Not the CA private key: the worker never signs certificates.
            items:
              - key: ca.crt
                path: ca.crt
              - key: job.key
                path: job.key
              - key: control.token
                path: control.token
        {{- end }}
        {{- if (.Values.worker.kubeconfig).secretName }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.worker.kubeconfig.secretName }}
            defaultMode: 0400
        {{- end }}
        - name: worker-data
          {{- if .Values.worker.dataDirEphemeralPVC.enabled }}
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  {{- include "worker.labels" . | nindent 18 }}
              spec:
                accessModes:
                  - {{ .Values.worker.dataDirEphemeralPVC.accessMode | default "ReadWriteOnce" }}
                {{- if .Values.worker.dataDirEphemeralPVC.storageClass }}
                storageClassName: {{ .Values.worker.dataDirEphemeralPVC.storageClass }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ .Values.worker.dataDirEphemeralPVC.size | default "1Gi" }}
          {{- else if .Values.worker.dataDirPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "worker.name" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
