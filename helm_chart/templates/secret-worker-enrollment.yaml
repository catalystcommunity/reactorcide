{{- /*
Managed worker enrollment token Secret (WORKERS_PLAN.md, zero-touch
auto-provision). A fresh k8s deploy needs NO manual `kubectl create secret`
step: this template generates the enrollment token ONCE and keeps it stable
across redeploys, and both the coordinator (app) and worker deployments
reference it (see the worker.enrollmentSecretName / worker.enrollmentSecretKey
helpers) -- the coordinator seeds its default worker pool from this token, the
worker enrolls with the same value, so the two always match.

Skipped entirely when the operator points worker.enrollmentTokenSecret.name at
a Secret THEY manage: in that case the two deployments read that Secret instead
and nothing is generated here.

Stability mechanism: `lookup` reads the already-applied Secret and we reuse its
value if present; only a first-ever install (no existing Secret) generates a new
`randAlphaNum`. The token value is never echoed, logged, or templated into any
other resource -- it lives only inside this (base64) Secret.

CAVEAT: `lookup` returns an empty map during `helm template`, `helm install
--dry-run`, and any client-side rendering with no live cluster connection, so
in those modes a *fresh* random value is produced on every render (there is no
prior Secret to read). That is expected and harmless -- the value that actually
lands in the cluster is the one produced by a real `helm install/upgrade`, which
then stays stable on subsequent upgrades via the lookup below. Never diff two
`helm template` runs and conclude the token "changes on every deploy".
*/ -}}
{{- if not .Values.worker.enrollmentTokenSecret.name }}
{{- $secretName := include "worker.enrollmentSecretName" . }}
{{- $secretKey := include "worker.enrollmentSecretKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := "" }}
{{- if $existing }}
{{- $token = index $existing.data $secretKey | default "" }}
{{- if $token }}
{{- $token = $token | b64dec }}
{{- end }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $secretKey }}: {{ $token | b64enc | quote }}
{{- end }}
