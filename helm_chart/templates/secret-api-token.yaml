{{- $secretName := .Values.defaults.apiTokenSecretName }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := "" }}
{{- $tokenId := "" }}

{{- /* Preserve an existing bootstrap token during chart upgrades. */}}
{{- if $existingSecret }}
  {{- $tokenData := index $existingSecret.data "token" | default "" }}
  {{- if $tokenData }}
    {{- $token = $tokenData | b64dec }}
  {{- end }}
  {{- $tokenIdData := index $existingSecret.data "token-id" | default "" }}
  {{- if $tokenIdData }}
    {{- $tokenId = $tokenIdData | b64dec }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if $token }}
  token: {{ $token | quote }}
  {{- end }}
  {{- if $tokenId }}
  token-id: {{ $tokenId | quote }}
  {{- end }}
