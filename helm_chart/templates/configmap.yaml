apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}-config
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  # Core configuration
  GRPC_MAX_MSG_SIZE_BYTES: {{ .Values.grpc.maxMessageSizeBytes | quote }}
  PORT: {{ .Values.app.service.port | quote }}
  COMMIT_ON_SUCCESS: {{ .Values.app.commitOnSuccess | quote }}

  # Prometheus configuration
  PROMETHEUS_ENABLED: {{ .Values.app.prometheus.enabled | quote }}
  PROMETHEUS_PATH: {{ .Values.app.prometheus.path | quote }}
  PROMETHEUS_PORT: {{ .Values.app.prometheus.port | quote }}
  PROMETHEUS_LATENCY_HISTOGRAMS_ENABLED: {{ .Values.app.prometheus.latencyHistogramsEnabled | quote }}

  # Corndogs configuration (CSIL-RPC over TCP on :5080; /healthz+/metrics on :8080)
  {{- if .Values.corndogs.enabled }}
  # Corndogs subchart is deployed - use internal service
  REACTORCIDE_CORNDOGS_BASE_URL: "{{ .Release.Name }}-corndogs:{{ .Values.corndogs.service.port }}"
  {{- else if .Values.corndogs.baseUrl }}
  # External Corndogs provided
  REACTORCIDE_CORNDOGS_BASE_URL: {{ .Values.corndogs.baseUrl | quote }}
  {{- end }}

  # Default configuration
  DEFAULT_QUEUE_NAME: {{ .Values.defaults.queueName | quote }}
  DEFAULT_TIMEOUT: {{ .Values.defaults.timeout | quote }}
  {{- if .Values.defaults.runnerImage }}
  REACTORCIDE_DEFAULT_RUNNER_IMAGE: {{ .Values.defaults.runnerImage | quote }}
  {{- end }}
  REACTORCIDE_DEFAULT_ORG: {{ .Values.defaults.orgName | quote }}
  REACTORCIDE_CHECKOUT_MODE: {{ .Values.defaults.checkoutMode | quote }}

  # Job containers submit child jobs / new workflows back to the coordinator API
  # (internal/worker.BuildJobEnv injects this as REACTORCIDE_COORDINATOR_URL into
  # each job container). This is the coordinator's own in-cluster URL -- the same
  # address the worker reaches it on. REQUIRED for eval jobs to spawn their
  # build/test/release children on the coordinator-mediated k8s path, where the
  # file-based triggers.json fallback is not retrievable from the ephemeral Job
  # pod. Paired with REACTORCIDE_API_TOKEN (secret) on the app deployment.
  REACTORCIDE_JOB_API_URL: {{ .Values.app.jobApiUrl | default (printf "http://%s.%s.svc.cluster.local:%v" (include "app.name" .) .Release.Namespace .Values.app.service.port) | quote }}

  # Object store configuration
  REACTORCIDE_OBJECT_STORE_TYPE: {{ .Values.objectStore.type | quote }}
  REACTORCIDE_OBJECT_STORE_BUCKET: {{ .Values.objectStore.bucket | quote }}
  REACTORCIDE_OBJECT_STORE_BASE_PATH: {{ .Values.objectStore.basePath | quote }}
  REACTORCIDE_OBJECT_STORE_PREFIX: {{ .Values.objectStore.prefix | quote }}
  REACTORCIDE_TELEMETRY_RETENTION_DAYS: {{ .Values.objectStore.telemetryRetentionDays | quote }}
  REACTORCIDE_AUDIT_RETENTION_DAYS: {{ .Values.audit.retentionDays | quote }}
  {{- if eq .Values.objectStore.type "s3" }}
  AWS_REGION: {{ .Values.objectStore.s3.region | quote }}
  REACTORCIDE_S3_ENDPOINT: {{ .Values.objectStore.s3.endpoint | quote }}
  {{- end }}

  # NOTE: this configmap is mounted via envFrom on the app (coordinator)
  # deployment only. The worker deployment (, coordinator-
  # mediated) sets its own explicit, minimal env in deployment-worker.yaml --
  # it does not use envFrom here, since almost none of this configmap
  # (corndogs, object store, default queue/timeout, UI auth) applies to a
  # worker. Worker-specific values (container runtime, concurrency, job API
  # URL, K8s job namespace/service-account/image-pull-secrets, builder sidecar
  # config) are computed directly in deployment-worker.yaml from the same
  # `worker.*` / `builder.*` values keys.

  # Management UI auth, RBAC, and visibility (see docs/ui-auth.md)
  REACTORCIDE_UI_AUTH_MODE: {{ .Values.uiAuth.mode | quote }}
  REACTORCIDE_CANCEL_GRACE_SECONDS: {{ .Values.uiAuth.cancelGraceSeconds | quote }}
  {{- if eq .Values.uiAuth.mode "local-rp" }}
  REACTORCIDE_LOCAL_RP_NAME: {{ .Values.uiAuth.localRpName | quote }}
  {{- end }}
  {{- if eq .Values.uiAuth.mode "rp" }}
  REACTORCIDE_LINKKEYS_RP_ADDR: {{ .Values.uiAuth.linkkeysRpAddr | quote }}
  REACTORCIDE_LINKKEYS_RP_FINGERPRINTS: {{ .Values.uiAuth.linkkeysRpFingerprints | quote }}
  {{- if .Values.uiAuth.linkkeysRpApplicationId }}
  REACTORCIDE_LINKKEYS_RP_APPLICATION_ID: {{ .Values.uiAuth.linkkeysRpApplicationId | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.uiAuth.firstAdmin }}
  REACTORCIDE_FIRST_ADMIN: {{ .Values.uiAuth.firstAdmin | quote }}
  {{- end }}
  {{- if .Values.uiAuth.trustedIdentities }}
  REACTORCIDE_TRUSTED_IDENTITIES: {{ .Values.uiAuth.trustedIdentities | quote }}
  {{- end }}
  {{- if .Values.uiAuth.callbackURL }}
  REACTORCIDE_UI_CALLBACK_URL: {{ .Values.uiAuth.callbackURL | quote }}
  {{- end }}
  # REACTORCIDE_LINKKEYS_RP_API_KEY / REACTORCIDE_BOOTSTRAP_ADMIN_TOKEN are
  # secret-bearing and read from {{ include "app.secretName" . }} (or
  # uiAuth.existingSecret) instead — see secret-app.yaml / deployment-app.yaml.
  {{- /* Settings added in 0.13 (docs/upgrade-0.13.md). An empty value
  ("" or null) does not set the variable, so the coordinator keeps its code
  default and the default render does not change. Numbers from a values file
  are float64 in Helm; convert them so that 268435456 does not render as
  2.68435456e+08. */}}
  {{- $optional := list
    (list "REACTORCIDE_OIDC_ISSUER_URL" (.Values.oidc).issuerUrl)
    (list "REACTORCIDE_WEBHOOK_RATE_LIMIT_PER_MINUTE" (.Values.rateLimits).webhookPerMinute)
    (list "REACTORCIDE_WEBHOOK_RATE_LIMIT_BURST" (.Values.rateLimits).webhookBurst)
    (list "REACTORCIDE_API_RATE_LIMIT_PER_MINUTE" (.Values.rateLimits).apiPerMinute)
    (list "REACTORCIDE_API_RATE_LIMIT_BURST" (.Values.rateLimits).apiBurst)
    (list "REACTORCIDE_TRUSTED_PROXY_CIDRS" (.Values.rateLimits).trustedProxyCIDRs)
    (list "REACTORCIDE_OUTBOUND_EVENTS_ENABLED" (.Values.outboundEvents).enabled)
    (list "REACTORCIDE_OUTBOUND_EVENTS_ALLOWED_NETWORKS" (.Values.outboundEvents).allowedNetworks)
    (list "REACTORCIDE_OBSERVABILITY_ENABLED" (.Values.observability).enabled)
    (list "REACTORCIDE_OBSERVABILITY_INTERVAL_SECONDS" (.Values.observability).intervalSeconds)
    (list "REACTORCIDE_OBSERVABILITY_ALERT_INTERVAL_SECONDS" (.Values.observability).alertIntervalSeconds)
    (list "REACTORCIDE_ROLLUP_HOURLY_RETENTION_DAYS" (.Values.observability).rollupHourlyRetentionDays)
    (list "REACTORCIDE_ROLLUP_DAILY_RETENTION_DAYS" (.Values.observability).rollupDailyRetentionDays)
    (list "REACTORCIDE_ARTIFACTS_ENABLED" (.Values.artifacts).enabled)
    (list "REACTORCIDE_ARTIFACT_MAX_FILE_BYTES" (.Values.artifacts).maxFileBytes)
    (list "REACTORCIDE_ARTIFACT_MAX_JOB_BYTES" (.Values.artifacts).maxJobBytes)
    (list "REACTORCIDE_ARTIFACT_MAX_FILES" (.Values.artifacts).maxFiles)
    (list "REACTORCIDE_FLAKY_WINDOW_DAYS" (.Values.artifacts).flakyWindowDays)
    (list "REACTORCIDE_PROVENANCE_ENABLED" (.Values.provenance).enabled)
    (list "REACTORCIDE_PROVENANCE_BUILDER_ID" (.Values.provenance).builderId)
    (list "REACTORCIDE_GROUP_VCS_SYNC_INTERVAL" (.Values.groupVcsSync).interval) }}
  {{- range $optional }}
  {{- $value := index . 1 }}
  {{- if kindIs "float64" $value }}{{ $value = int64 $value }}{{ end }}
  {{- if and (not (kindIs "invalid" $value)) (ne (toString $value) "") }}
  {{ index . 0 }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
  {{- /* null does not set the variable (shared namespace "standard"); an
  empty string turns the shared builder cache volume off. */}}
  {{- if not (kindIs "invalid" (.Values.cache).sharedNamespace) }}
  REACTORCIDE_CACHE_SHARED_NAMESPACE: {{ toString .Values.cache.sharedNamespace | quote }}
  {{- end }}
