apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}-config
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  # Core configuration
  GRPC_MAX_MSG_SIZE_BYTES: {{ .Values.grpc.maxMessageSizeBytes | quote }}
  PORT: {{ .Values.app.service.port | quote }}
  COMMIT_ON_SUCCESS: {{ .Values.app.commitOnSuccess | quote }}

  # Prometheus configuration
  PROMETHEUS_ENABLED: {{ .Values.app.prometheus.enabled | quote }}
  PROMETHEUS_PATH: {{ .Values.app.prometheus.path | quote }}
  PROMETHEUS_PORT: {{ .Values.app.prometheus.port | quote }}
  PROMETHEUS_LATENCY_HISTOGRAMS_ENABLED: {{ .Values.app.prometheus.latencyHistogramsEnabled | quote }}

  # Corndogs configuration (CSIL-RPC over TCP on :5080; /healthz+/metrics on :8080)
  {{- if .Values.corndogs.enabled }}
  # Corndogs subchart is deployed - use internal service
  REACTORCIDE_CORNDOGS_BASE_URL: "{{ .Release.Name }}-corndogs:{{ .Values.corndogs.service.port }}"
  {{- else if .Values.corndogs.baseUrl }}
  # External Corndogs provided
  REACTORCIDE_CORNDOGS_BASE_URL: {{ .Values.corndogs.baseUrl | quote }}
  {{- end }}

  # Default configuration
  DEFAULT_QUEUE_NAME: {{ .Values.defaults.queueName | quote }}
  DEFAULT_TIMEOUT: {{ .Values.defaults.timeout | quote }}
  {{- if .Values.defaults.runnerImage }}
  REACTORCIDE_DEFAULT_RUNNER_IMAGE: {{ .Values.defaults.runnerImage | quote }}
  {{- end }}
  # REACTORCIDE_DEFAULT_USER_ID is read from {{ .Values.defaults.userSecretName }} secret

  # Object store configuration
  REACTORCIDE_OBJECT_STORE_TYPE: {{ .Values.objectStore.type | quote }}
  REACTORCIDE_OBJECT_STORE_BUCKET: {{ .Values.objectStore.bucket | quote }}
  REACTORCIDE_OBJECT_STORE_BASE_PATH: {{ .Values.objectStore.basePath | quote }}
  REACTORCIDE_OBJECT_STORE_PREFIX: {{ .Values.objectStore.prefix | quote }}
  {{- if eq .Values.objectStore.type "s3" }}
  AWS_REGION: {{ .Values.objectStore.s3.region | quote }}
  REACTORCIDE_S3_ENDPOINT: {{ .Values.objectStore.s3.endpoint | quote }}
  {{- end }}

  # NOTE: this configmap is mounted via envFrom on the app (coordinator)
  # deployment only. The worker deployment (WORKERS_PLAN.md, coordinator-
  # mediated) sets its own explicit, minimal env in deployment-worker.yaml --
  # it does not use envFrom here, since almost none of this configmap
  # (corndogs, object store, default queue/timeout, UI auth) applies to a
  # worker. Worker-specific values (container runtime, concurrency, job API
  # URL, K8s job namespace/service-account/image-pull-secrets, builder sidecar
  # config) are computed directly in deployment-worker.yaml from the same
  # `worker.*` / `builder.*` values keys.

  # Management UI auth, RBAC, and visibility (see docs/ui-auth.md)
  REACTORCIDE_UI_AUTH_MODE: {{ .Values.uiAuth.mode | quote }}
  REACTORCIDE_CANCEL_GRACE_SECONDS: {{ .Values.uiAuth.cancelGraceSeconds | quote }}
  {{- if eq .Values.uiAuth.mode "local-rp" }}
  REACTORCIDE_LOCAL_RP_NAME: {{ .Values.uiAuth.localRpName | quote }}
  {{- end }}
  {{- if eq .Values.uiAuth.mode "rp" }}
  REACTORCIDE_LINKKEYS_RP_ADDR: {{ .Values.uiAuth.linkkeysRpAddr | quote }}
  REACTORCIDE_LINKKEYS_RP_FINGERPRINTS: {{ .Values.uiAuth.linkkeysRpFingerprints | quote }}
  {{- end }}
  {{- if .Values.uiAuth.firstAdmin }}
  REACTORCIDE_FIRST_ADMIN: {{ .Values.uiAuth.firstAdmin | quote }}
  {{- end }}
  {{- if .Values.uiAuth.trustedIdentities }}
  REACTORCIDE_TRUSTED_IDENTITIES: {{ .Values.uiAuth.trustedIdentities | quote }}
  {{- end }}
  {{- if .Values.uiAuth.callbackURL }}
  REACTORCIDE_UI_CALLBACK_URL: {{ .Values.uiAuth.callbackURL | quote }}
  {{- end }}
  # REACTORCIDE_LINKKEYS_RP_API_KEY / REACTORCIDE_BOOTSTRAP_ADMIN_TOKEN are
  # secret-bearing and read from {{ include "app.secretName" . }} (or
  # uiAuth.existingSecret) instead — see secret-app.yaml / deployment-app.yaml.
