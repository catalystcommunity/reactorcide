<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Reactorcide">
  <title>Reactorcide</title>
  <defs>
    <linearGradient id="rc-fav-flame" x1="32" y1="2" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.45" stop-color="#f7842b"/>
      <stop offset="1" stop-color="#e0322c"/>
    </linearGradient>
  </defs>
  <!-- One orbit, heavy stroke, EXPLICIT colour: a favicon renders with no CSS
       colour context, so currentColor would resolve to black on a dark tab strip.
       #8b96a5 is a mid-tone that holds on both light and dark chrome.
       Three orbits at 2px turn to mush at 16px, so there is only one. -->
  <ellipse cx="32" cy="34" rx="30" ry="12" fill="none" stroke="#8b96a5" stroke-width="5" transform="rotate(-24 32 34)"/>
  <path fill="url(#rc-fav-flame)" d="M32 2c8 13.6 19.4 20.1 19.4 34.7C51.4 50.4 42.9 60.6 32 62.5 21.1 60.6 12.6 50.4 12.6 36.7c0-9 4.4-13.8 8.5-18.9 1.3 7.2 4.4 10.8 6.9 12.5C25.6 18.4 27.7 9.4 32 2Z"/>
</svg>
