# Local development docker-compose for Reactorcide
# Usage: docker compose up -d

services:
    # PostgreSQL database for Coordinator
    postgres:
        image: postgres:17
        container_name: reactorcide-postgres-dev
        environment:
            POSTGRES_USER: reactorcide
            POSTGRES_PASSWORD: devpass123
            POSTGRES_DB: reactorcide_db
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U reactorcide"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - reactorcide

    # Corndogs Task Queue
    corndogs:
        image: containers.catalystsquad.com/public/catalystcommunity/corndogs:0.8.1
        container_name: reactorcide-corndogs-dev
        user: "0:0"
        environment:
            STORAGE_BACKEND: file
            CORNDOGS_FILESTORE_DIR: /data
            CORNDOGS_FILESTORE_SYNC: group
        volumes:
            - corndogs_data:/data
        networks:
            - reactorcide
        command: ["run"]

    # Coordinator API
    coordinator-api:
        build:
            context: .
            dockerfile: Dockerfile.coordinator.dev
        image: reactorcide/coordinator:dev
        container_name: reactorcide-coordinator-dev
        command: ["serve"]
        environment:
            REACTORCIDE_DB_URI: "postgresql://reactorcide:devpass123@postgres:5432/reactorcide_db?sslmode=disable"
            PORT: "8080"
            REACTORCIDE_CORNDOGS_BASE_URL: corndogs:5080
            REACTORCIDE_JWT_SECRET: dev-secret-change-in-production-12345
            REACTORCIDE_OBJECT_STORE_TYPE: filesystem
            REACTORCIDE_OBJECT_STORE_BASE_PATH: /var/lib/reactorcide
            REACTORCIDE_LOG_LEVEL: debug
            REACTORCIDE_DEFAULT_ORG: "default"
            REACTORCIDE_CHECKOUT_MODE: "isolated"
            REACTORCIDE_AUDIT_RETENTION_DAYS: "365"
            # Management UI auth (see docs/ui-auth.md). "none" (the default,
            # set explicitly here for clarity) means no login: anyone
            # reaching the web UI can view public projects/jobs and
            # gracefully cancel a job. Uncomment to try LinkKeys login
            # locally:
            # REACTORCIDE_UI_AUTH_MODE: local-rp
            # REACTORCIDE_LOCAL_RP_NAME: reactorcide-dev
            # REACTORCIDE_UI_CALLBACK_URL: "http://localhost:5080"
            # REACTORCIDE_FIRST_ADMIN: "you@your-domain.example"
            # REACTORCIDE_TRUSTED_IDENTITIES: "your-domain.example"
            REACTORCIDE_UI_AUTH_MODE: none
            # One-time bootstrap-admin session. Visit
            # http://localhost:5080/app/signin, where the bootstrap form appears
            # while no global admin exists yet. Obviously-fake dev-only value;
            # never reuse this for a real deployment.
            REACTORCIDE_BOOTSTRAP_ADMIN_TOKEN: dev-bootstrap-token-change-me
            # Worker bootstrap:
            # on first boot with no worker pools yet, the coordinator seeds a
            # default pool + enrollment token equal to this value so the dev
            # worker below can enroll without any manual admin step. Obviously-
            # fake dev-only value; never reuse this for a real deployment --
            # production wires a real per-pool token via a Secret instead (see
            # helm_chart/values.yaml worker.enrollmentTokenSecret and
            # docs/workers.md).
            REACTORCIDE_DEFAULT_WORKER_ENROLLMENT_TOKEN: ${REACTORCIDE_WORKER_ENROLLMENT_TOKEN:-dev-worker-enroll-token-change-me}
        ports:
            - "8080:8080"
        volumes:
            - reactorcide_data:/var/lib/reactorcide
        depends_on:
            postgres:
                condition: service_healthy
            corndogs:
                condition: service_started
        networks:
            - reactorcide

    # Worker
    #
    # Coordinator-mediated: the worker only needs a
    # coordinator URL + enrollment token + a writable data dir for its
    # persisted worker_key. It no longer talks to corndogs, Postgres, or
    # object storage directly -- the coordinator brokers all of that.
    worker:
        build:
            context: .
            dockerfile: Dockerfile.worker.dev
        image: reactorcide/worker:dev
        container_name: reactorcide-worker-dev
        command:
            - --allow-insecure-transport
        environment:
            REACTORCIDE_COORDINATOR_URL: http://coordinator-api:8080
            # Dev-only bootstrap token; must match coordinator-api's
            # REACTORCIDE_DEFAULT_WORKER_ENROLLMENT_TOKEN above. In production
            # this comes from a real per-pool enrollment token stored as a
            # secret (see docs/workers.md), never a literal here.
            REACTORCIDE_WORKER_ENROLLMENT_TOKEN: ${REACTORCIDE_WORKER_ENROLLMENT_TOKEN:-dev-worker-enroll-token-change-me}
            REACTORCIDE_WORKER_DATA_DIR: /var/lib/reactorcide-worker
            REACTORCIDE_CONTAINER_RUNTIME: docker
            REACTORCIDE_WORKER_CONCURRENCY: "2"
            REACTORCIDE_WORKER_METRICS_INTERVAL: ${REACTORCIDE_WORKER_METRICS_INTERVAL:-2s}
            REACTORCIDE_WORKER_STORAGE_METRICS_INTERVAL: ${REACTORCIDE_WORKER_STORAGE_METRICS_INTERVAL:-10s}
            REACTORCIDE_WORKER_TELEMETRY_SEND_INTERVAL: ${REACTORCIDE_WORKER_TELEMETRY_SEND_INTERVAL:-10s}
            REACTORCIDE_WORKER_TELEMETRY_BUFFER_BATCHES: ${REACTORCIDE_WORKER_TELEMETRY_BUFFER_BATCHES:-12}
            REACTORCIDE_LOG_LEVEL: debug
            # Egress proxy (docs/egress-proxy.md). Empty (the default) means
            # no egress proxy. To try it: scripts/egress-dev-keys.sh, then
            # `docker compose --profile egress up -d` with these in .env:
            #   REACTORCIDE_EGRESS_CONTROL_URL=http://egress-proxy:8080
            #   REACTORCIDE_EGRESS_PROXY_ADDR=egress-proxy:3128
            #   REACTORCIDE_EGRESS_NETWORK=reactorcide_reactorcide
            REACTORCIDE_EGRESS_CONTROL_URL: ${REACTORCIDE_EGRESS_CONTROL_URL:-}
            REACTORCIDE_EGRESS_PROXY_ADDR: ${REACTORCIDE_EGRESS_PROXY_ADDR:-}
            REACTORCIDE_EGRESS_NETWORK: ${REACTORCIDE_EGRESS_NETWORK:-}
            REACTORCIDE_EGRESS_NET_IMAGE: ${REACTORCIDE_EGRESS_NET_IMAGE:-reactorcide/egress:dev}
            REACTORCIDE_EGRESS_CONTROL_TOKEN_FILE: /etc/reactorcide/egress/control.token
            REACTORCIDE_EGRESS_JOB_KEY_FILE: /etc/reactorcide/egress/job.key
            REACTORCIDE_EGRESS_CA_FILE: /etc/reactorcide/egress/ca.crt
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - reactorcide_worker_data:/var/lib/reactorcide-worker
            - /tmp/reactorcide-jobs:/tmp/reactorcide-jobs
            - reactorcide_egress_keys:/etc/reactorcide/egress:ro
        depends_on:
            coordinator-api:
                condition: service_started
        stop_grace_period: 1h
        networks:
            - reactorcide

    # Web UI
    web:
        build:
            context: .
            dockerfile: Dockerfile.web.dev
        image: reactorcide/web:dev
        container_name: reactorcide-web-dev
        command:
            - serve
            - --allow-insecure-transport
        environment:
            REACTORCIDE_API_URL: "http://coordinator-api:8080"
            # The web UI needs no API token. It forwards the browser's own
            # session to the coordinator instead of holding a service
            # credential of its own.
            PORT: "5080"
            # This dev stack serves plain HTTP with no TLS terminator in
            # front of it, so the session cookie must not require Secure or
            # no browser will ever send it back. Never set this for a real
            # deployment (see docs/ui-auth.md).
            REACTORCIDE_WEB_COOKIE_INSECURE: "true"
        ports:
            - "5080:5080"
        depends_on:
            coordinator-api:
                condition: service_started
        networks:
            - reactorcide

    # Egress proxy (docs/egress-proxy.md). Only with the "egress" profile:
    # `docker compose --profile egress up -d`. Make its keys first with
    # scripts/egress-dev-keys.sh (they go into reactorcide_egress_keys).
    egress-proxy:
        profiles: ["egress"]
        build:
            context: ./egress_proxy
            dockerfile: Dockerfile
        image: reactorcide/egress:dev
        container_name: reactorcide-egress-dev
        # Dev only: the keys in the volume belong to root.
        user: "0:0"
        environment:
            REACTORCIDE_EGRESS_CA_CERT: /etc/reactorcide/egress/ca.crt
            REACTORCIDE_EGRESS_CA_KEY: /etc/reactorcide/egress/ca.key
            REACTORCIDE_EGRESS_JOB_KEY: /etc/reactorcide/egress/job.key
            REACTORCIDE_EGRESS_CONTROL_TOKEN_FILE: /etc/reactorcide/egress/control.token
            REACTORCIDE_EGRESS_POLICY: ${REACTORCIDE_EGRESS_POLICY:-}
        volumes:
            - reactorcide_egress_keys:/etc/reactorcide/egress:ro
        networks:
            - reactorcide

networks:
    reactorcide:
        driver: bridge

volumes:
    postgres_data:
    corndogs_data:
    reactorcide_data:
    # Worker's persisted worker_key (not a secret). Not shared with
    # coordinator-api's reactorcide_data -- the worker no longer touches
    # object storage.
    reactorcide_worker_data:
    # Egress proxy keys (scripts/egress-dev-keys.sh). Empty unless you make
    # them; an empty volume keeps the worker without an egress proxy.
    reactorcide_egress_keys:
